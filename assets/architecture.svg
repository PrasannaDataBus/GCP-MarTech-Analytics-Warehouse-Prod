  <path d="M1525 655 H1573" class="line" marker-end="url(#arr)"/>

  <!-- Orchestration bar -->
  <rect x="380" y="776" width="1400" height="96" rx="14" fill="#101828"/>
  <text x="404" y="814" font-size="21" font-weight="700" fill="#FFFFFF">Apache Airflow on Docker  ·  45+ DAGs per environment (Dev + Prod)</text>
  <text x="404" y="848" font-size="16" fill="#D0D5DD">Extract DAGs load Bronze  →  one atomic dbt DAG per mart:  dbt debug → Silver → Gold → dbt test  (a Silver failure stops Gold, so dashboards never show stale data)</text>
  <path d="M525 772 V716" class="line" stroke="#101828" marker-end="url(#arr)"/>
  <path d="M1180 772 V716" class="line" stroke="#101828" marker-end="url(#arr)"/>

  <!-- Deployment flow -->
  <text x="40" y="930" class="colt">DEV → PROD PROMOTION</text>
  <rect x="40" y="948" width="480" height="128" rx="14" class="card"/>
  <rect x="40" y="948" width="8" height="128" rx="4" fill="#2E90FA"/>
  <text x="66" y="984" class="bt2">Dev · build &amp; validate</text>
  <text x="66" y="1012" class="code">GCP-MarTech-…-Dev + Airflow-Docker-Dev</text>
  <text x="66" y="1040" class="sm">Manual DAG triggers · Slim CI (14 days)</text>
  <text x="66" y="1062" class="sm">Development workstation</text>

  <path d="M520 1012 H588" class="line" marker-end="url(#arr)"/>
  <text x="526" y="1000" class="chips">tested</text>

  <rect x="595" y="948" width="600" height="128" rx="14" class="card"/>
  <rect x="595" y="948" width="8" height="128" rx="4" fill="#7A5AF8"/>
  <text x="621" y="984" class="bt2">Git-based release</text>
  <rect x="617" y="996" width="560" height="54" rx="8" class="codebg"/>
  <text x="629" y="1018" class="code">git fetch dev → git merge dev/master</text>
  <text x="629" y="1040" class="code">→ git push prod master</text>
  <text x="621" y="1066" class="sm">Validated Dev code promoted into the Prod repositories</text>

  <path d="M1195 1012 H1263" class="line" marker-end="url(#arr)"/>
  <text x="1203" y="1000" class="chips">git pull</text>

  <rect x="1270" y="948" width="510" height="128" rx="14" class="card"/>
  <rect x="1270" y="948" width="8" height="128" rx="4" fill="#12B76A"/>
  <text x="1296" y="984" class="bt2">Prod · always-on runtime host</text>
  <text x="1296" y="1012" class="code">GCP-MarTech-…-Prod + Airflow-Docker-Prod</text>
  <text x="1296" y="1040" class="sm">Daily schedule · full history · email alerts</text>
  <text x="1296" y="1062" class="sm">Dedicated machine keeps pipelines up</text>

  <!-- Cross-cutting chips -->
  <text x="40" y="1118" class="colt">ENGINEERING PRACTICES</text>
  <rect x="40" y="1136" width="420" height="80" rx="12" class="card"/>
  <text x="60" y="1170" class="chip">Documentation</text>
  <text x="60" y="1196" class="chips">Data dictionary · dbt &amp; GCP standards · release guide</text>

  <rect x="480" y="1136" width="420" height="80" rx="12" class="card"/>
  <text x="500" y="1170" class="chip">Slim CI via dbt macro</text>
  <text x="500" y="1196" class="chips">Dev limited to 14 days · &gt;90% compute saved</text>

  <rect x="920" y="1136" width="420" height="80" rx="12" class="card"/>
  <text x="940" y="1170" class="chip">Observability</text>
  <text x="940" y="1196" class="chips">Email alerts on failure · retries · repair job</text>

  <rect x="1360" y="1136" width="420" height="80" rx="12" class="card"/>
  <text x="1380" y="1170" class="chip">Security</text>
  <text x="1380" y="1196" class="chips">Secrets in .env (git-ignored) · least-privilege SAs</text>
